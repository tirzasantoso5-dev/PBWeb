<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Saya — Modul 12 (Shadow DOM, Slot, Event)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Blog Belajar Web</h1>
    <!-- B.2 — custom element pertama -->
    <salam-pengguna nama="Pengunjung"></salam-pengguna>
    <nav>
      <button id="btn-tema">Mode Gelap</button>
      <button id="btn-info">Info Tambahan</button>
    </nav>
  </header>

  <main>
    <!-- B.6 — <daftar-artikel> mengambil data dari API dan menyusun <kartu-artikel>.
         Class daftar-artikel dipertahankan agar grid (style.css) dan listener
         event di script.js tetap menemukan elemennya. -->
    <daftar-artikel class="daftar-artikel" batas="6"></daftar-artikel>

    <aside>
      <h2>Tentang Penulis</h2>
      <p>Nama: <span id="nama-penulis">...</span></p>
      <p>Email: <span id="email-penulis">...</span></p>
    </aside>

    <!-- Komentar: POST saat kirim, DELETE per item (Modul 8).
         Daftar komentar kini berisi <kartu-komentar> (Modul 12), jadi memakai <div>, bukan <ul>. -->
    <section id="komentar">
      <h2>Tinggalkan Komentar</h2>
      <form id="form-komentar">
        <input type="text" id="input-nama" placeholder="Nama Anda"
               required minlength="3" maxlength="30">
        <textarea id="input-pesan" placeholder="Tulis komentar..."
                  required minlength="5" maxlength="200"></textarea>
        <button type="submit">Kirim</button>
      </form>
      <div id="daftar-komentar"></div>
    </section>

    <!-- Form pendaftaran akun (Modul 5) -->
    <section id="pendaftaran">
      <h2>Pendaftaran Akun</h2>
      <form id="form-daftar">
        <input type="text" id="username" placeholder="Username" required minlength="4">
        <span class="pesan-error" id="error-username"></span>
        <input type="email" id="email" placeholder="Email" required>
        <span class="pesan-error" id="error-email"></span>
        <input type="password" id="password" placeholder="Password" required minlength="8">
        <span class="pesan-error" id="error-password"></span>
        <input type="password" id="konfirmasi" placeholder="Konfirmasi Password" required>
        <span class="pesan-error" id="error-konfirmasi"></span>
        <button type="submit">Daftar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Blog Belajar Web. Tekan "d" untuk beralih mode gelap.</p>
    <button id="btn-reset">Reset Semua Data</button>
  </footer>

  <!-- komponen.js SEBELUM script.js agar komponen sudah terdaftar -->
  <script src="komponen.js"></script>
  <script src="script.js"></script>
</body>
</html>
